name: Backtest
on:
  push:
    branches: [backtest]
    paths: [backtest.py, .github/workflows/backtest.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тест на истории
        run: python backtest.py --suite trail --out results_trail 2>&1 | tee results-log.txt
      - name: Сохранить результаты в ветку
        if: always()
        run: |
          mkdir -p results_trail && cp results-log.txt results_trail/log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_trail
          git commit -m "Результаты теста на истории" || exit 0
          git pull --rebase -X theirs origin backtest || true
          git push
