name: Intraday backtest
on:
  push:
    branches: [backtest]
    paths: [intraday.py, .github/workflows/intraday.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тест внутридневной сетки
        run: python intraday.py results_intraday 2>&1 | tee intraday-log.txt
      - name: Сохранить результаты в ветку
        if: always()
        run: |
          mkdir -p results_intraday && cp intraday-log.txt results_intraday/log.txt || true
          ls -la results_intraday
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_intraday
          git commit -m "Результаты внутридневного теста" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin backtest && git push && break; sleep 10; done
